owner: santai-inc
repo: santai-status

sites:
  - name: Hub website
    url: https://hub.sant.ai
    expectedStatusCodes:
      - 200
  - name: Hub API
    url: https://hub.sant.ai/health
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"status":"ok"'

secrets: []
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

status-website:
  baseUrl: /santai-status
  name: Santai Hub Status
  logoUrl: https://raw.githubusercontent.com/santai-inc/santai-status/HEAD/assets/logo.svg
  theme: light
  introTitle: "**Santai Hub** service status"
  introMessage: Availability checks for the Hub website and API, scheduled every five minutes. Checks may be delayed. These checks do not verify individual features such as editing or chat. History begins when monitoring starts.
  navbar:
    - title: Status
      href: /
    - title: Santai Hub
      href: https://hub.sant.ai
    - title: Incidents
      href: https://github.com/santai-inc/santai-status/issues?q=label%3Astatus
