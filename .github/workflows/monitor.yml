name: Monitor availability
on:
  schedule:
    - cron: "2-57/5 * * * *"
  push:
    branches: [master]
    paths: [".upptimerc.yml", ".github/workflows/monitor.yml"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upptime-data
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - name: Ensure maintenance label exists
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create maintenance --color 737373 --description "Scheduled maintenance window" --force
      - name: Check website and API
        uses: upptime/uptime-monitor@v1.44.0
        with:
          command: update
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{}'
